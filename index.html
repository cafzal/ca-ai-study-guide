<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Study</title>
<style>
  :root {
    --bg: #fafaf7;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #555;
    --ink-fainter: #888;
    --line: #e5e3dc;
    --accent: #5b3fa8;
    --accent-soft: #efeafa;
    --good: #2f8a4e;
    --good-soft: #e3f3e9;
    --bad: #c0392b;
    --bad-soft: #fbe9e7;
    --warn: #b8860b;
    --warn-soft: #fbf3df;
    --code: #f1efe8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 24px 100px 24px;
  }

  /* Header */
  header.app-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  header.app-header h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.app-header .sub {
    font-size: 13px;
    color: var(--ink-fainter);
  }

  /* Progress */
  .progress-row {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .progress-cell {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .progress-cell.read { background: #c4b8e6; }
  .progress-cell.quizzed { background: var(--accent); }
  .progress-cell.active {
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  /* Tabs */
  nav.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  nav.tabs button {
    background: none;
    border: none;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    margin-bottom: -1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 500;
  }

  /* Lesson layout */
  .lesson h2 {
    font-size: 26px;
    margin: 8px 0 4px 0;
    letter-spacing: -0.015em;
  }
  .lesson .spine {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 24px;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
  }
  .lesson section.block {
    margin: 26px 0;
  }
  .lesson section.block > h3 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin: 0 0 10px 0;
  }
  .lesson p { margin: 10px 0; }
  .lesson ul, .lesson ol { padding-left: 22px; }
  .lesson li { margin: 6px 0; }
  .lesson .callout {
    padding: 12px 14px;
    border-radius: 6px;
    background: var(--code);
    font-size: 14px;
    margin: 12px 0;
  }
  .lesson .callout.warn { background: var(--warn-soft); }
  .lesson .callout.good { background: var(--good-soft); }
  .lesson .callout.bad { background: var(--bad-soft); }
  .lesson code {
    background: var(--code);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .lesson .formula {
    text-align: center;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: var(--code);
    padding: 14px;
    border-radius: 6px;
    margin: 14px 0;
    font-size: 15px;
  }

  /* Interactive visual panels */
  .visual {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
    margin: 16px 0;
  }
  .visual .v-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-fainter);
    margin-bottom: 12px;
  }
  .visual .v-controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 14px;
  }
  .visual .v-controls input[type="range"] {
    flex: 1;
    min-width: 120px;
  }
  .visual .v-readout {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .btn {
    padding: 6px 14px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    transition: all 0.15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn.primary:hover { background: #4a319a; color: white; }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Token row (L1 doorway) */
  .token-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
    min-height: 40px;
    padding: 8px;
    border: 1px dashed var(--line);
    border-radius: 6px;
    background: #fdfcf8;
  }
  .token-box {
    padding: 4px 10px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 4px;
    font-family: "SF Mono", monospace;
    font-size: 13px;
    animation: tokenPop 0.3s ease;
  }
  .token-box.pending {
    background: var(--line);
    color: var(--ink-fainter);
  }
  @keyframes tokenPop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Attention matrix */
  .matrix-grid {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 4px;
    width: max-content;
    margin: 12px auto;
  }
  .matrix-cell {
    width: 14px;
    height: 14px;
    background: var(--panel);
  }
  .matrix-cell.lit { background: var(--accent); }
  .matrix-cell.half { background: var(--accent-soft); }

  /* Image strip for diffusion */
  .noise-strip {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: space-between;
    margin: 12px 0;
  }
  .noise-img {
    width: 64px;
    height: 64px;
    border-radius: 4px;
    border: 1px solid var(--line);
    image-rendering: pixelated;
  }
  .noise-label {
    font-size: 11px;
    color: var(--ink-fainter);
    text-align: center;
    font-family: "SF Mono", monospace;
  }
  .noise-cell { text-align: center; }
  .arrow {
    color: var(--ink-fainter);
    font-size: 18px;
  }

  /* Walk comparison */
  .walks-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .walks-row > .walk-panel {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    background: #fdfcf8;
  }
  .walks-row .walk-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-fainter);
    margin-bottom: 8px;
  }
  .walks-row svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .walk-counter {
    font-family: "SF Mono", monospace;
    font-size: 12px;
    margin-top: 6px;
    color: var(--ink-soft);
  }

  /* DPO before/after */
  .dpo-compare {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: center;
    margin: 14px 0;
  }
  .dpo-side {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    background: #fdfcf8;
  }
  .dpo-side.before { border-color: var(--bad); }
  .dpo-side.after { border-color: var(--good); }
  .dpo-side h4 {
    margin: 0 0 8px 0;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .dpo-side ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
  }
  .dpo-arrow {
    text-align: center;
    color: var(--accent);
    font-size: 26px;
  }

  /* Mask placement */
  .mask-compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin: 14px 0;
  }
  .mask-card {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
  }
  .mask-card.good { background: var(--good-soft); border-color: var(--good); }
  .mask-card.bad { background: var(--bad-soft); border-color: var(--bad); }
  .mask-card .big-num {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .mask-card.good .big-num { color: var(--good); }
  .mask-card.bad .big-num { color: var(--bad); }
  .mask-card .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-fainter);
  }
  .mask-card .desc {
    font-size: 13px;
    margin-top: 8px;
  }

  /* Use case table */
  .ucase-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 14px 0;
  }
  .ucase-table th, .ucase-table td {
    border: 1px solid var(--line);
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  .ucase-table th {
    background: var(--code);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .ucase-table tr.fork td { background: #fdfcf8; padding-left: 22px; font-size: 12px; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .pill.h { background: var(--good-soft); color: var(--good); }
  .pill.m { background: var(--warn-soft); color: var(--warn); }
  .pill.l { background: var(--bad-soft); color: var(--bad); }

  /* L4 — 4 mechanisms grid */
  .four-mech {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
  }
  .mech-card {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    background: var(--panel);
  }
  .mech-card .mech-name {
    font-weight: 600;
    color: var(--accent);
    font-size: 13px;
    margin-bottom: 2px;
  }
  .mech-card .mech-paper {
    font-size: 10px;
    color: var(--ink-fainter);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .mech-card .mech-does {
    font-size: 13px;
    margin-bottom: 8px;
  }
  .mech-card .mech-vs {
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 4px;
    background: var(--code);
    color: var(--ink-soft);
  }
  .mech-card .mech-vs strong { color: var(--bad); }
  @media (max-width: 700px) {
    .four-mech { grid-template-columns: 1fr; }
  }

  /* Scorecard verdict labels */
  .verdict-diff, .verdict-ar, .verdict-split {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 600;
    margin-right: 4px;
    white-space: nowrap;
  }
  .verdict-diff { background: var(--accent-soft); color: var(--accent); }
  .verdict-ar { background: var(--warn-soft); color: var(--warn); }
  .verdict-split { background: var(--code); color: var(--ink-soft); }
  .ucase-table.scorecard td { line-height: 1.45; }
  .ucase-table.scorecard tr:hover td { background: #fbfaf5; }

  /* Axis framework */
  .axis-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 16px 0;
  }
  .axis-card {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    background: var(--panel);
  }
  .axis-card .num {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .axis-card .title {
    font-weight: 600;
    margin: 4px 0;
    font-size: 14px;
  }
  .axis-card .fed {
    font-size: 12px;
    color: var(--ink-fainter);
    border-top: 1px solid var(--line);
    margin-top: 8px;
    padding-top: 6px;
  }

  /* Quiz */
  .quiz {
    margin-top: 36px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 22px;
    background: #fcfbff;
  }
  .quiz h3 {
    margin: 0 0 4px 0;
    color: var(--accent);
    font-size: 16px;
  }
  .quiz .quiz-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .quiz-item {
    margin: 14px 0;
    padding: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .quiz-q {
    font-weight: 500;
    margin-bottom: 10px;
  }
  .quiz-q .q-label {
    color: var(--accent);
    font-family: "SF Mono", monospace;
    font-weight: 600;
    margin-right: 6px;
  }
  .quiz-response {
    margin: 10px 0;
  }
  .quiz-response .response-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-fainter);
    margin-bottom: 4px;
  }
  .quiz-response .save-hint {
    font-size: 10px;
    color: var(--ink-fainter);
    text-transform: none;
    letter-spacing: 0;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .quiz-response .save-hint.visible { opacity: 1; }
  .quiz-response textarea {
    width: 100%;
    min-height: 70px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    background: #fdfcf8;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease;
    overflow: hidden;
  }
  .quiz-response textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }
  .quiz-answer {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding: 12px;
    border-radius: 0 5px 5px 0;
    font-size: 14px;
    margin-top: 10px;
    display: none;
  }
  .quiz-answer.visible { display: block; }
  .quiz-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .self-grade {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: none;
    font-size: 13px;
  }
  .self-grade.visible { display: block; }
  .self-grade-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    align-items: center;
  }
  .grade-btn {
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }
  .grade-btn.selected.got { background: var(--good); color: white; border-color: var(--good); }
  .grade-btn.selected.partial { background: var(--warn); color: white; border-color: var(--warn); }
  .grade-btn.selected.unsure { background: var(--ink-soft); color: white; border-color: var(--ink-soft); }
  .quiz-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    align-items: center;
  }
  .quiz-summary {
    margin-top: 16px;
    padding: 12px;
    background: var(--accent-soft);
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
    display: none;
  }
  .quiz-summary.visible { display: block; }

  /* Footer / nav */
  .lesson-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .lesson-nav .btn { font-size: 14px; padding: 8px 16px; }

  /* Appendix special styling */
  .appendix-block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    margin: 14px 0;
    border-radius: 0 6px 6px 0;
  }
  .appendix-block h4 {
    margin: 0 0 8px 0;
    color: var(--accent);
    font-size: 14px;
  }
  .appendix-block ol, .appendix-block ul {
    margin: 8px 0;
    padding-left: 22px;
  }
  .appendix-block li { font-size: 14px; margin: 8px 0; }

  /* Pipeline (L0) */
  .pipeline {
    display: flex;
    margin: 16px 0;
    flex-wrap: wrap;
    gap: 0;
  }
  .pipe-stage {
    flex: 1;
    min-width: 90px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 8px;
    text-align: center;
    position: relative;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .pipe-stage:not(:last-child) { border-right: none; }
  .pipe-stage:first-child { border-radius: 6px 0 0 6px; }
  .pipe-stage:last-child { border-radius: 0 6px 6px 0; }
  .pipe-stage:hover { background: var(--accent-soft); }
  .pipe-stage.active { background: var(--accent-soft); border-color: var(--accent); }
  .pipe-stage .pipe-num {
    font-size: 10px;
    color: var(--ink-fainter);
    font-family: "SF Mono", monospace;
  }
  .pipe-stage .pipe-name {
    font-weight: 600;
    font-size: 13px;
    margin: 4px 0;
    color: var(--ink);
  }
  .pipe-stage .pipe-teaches {
    font-size: 11px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .pipe-detail {
    margin-top: 14px;
    padding: 14px;
    background: var(--accent-soft);
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .pipe-detail.visible { display: block; }
  .pipe-detail h5 {
    margin: 0 0 6px 0;
    color: var(--accent);
    font-size: 13px;
  }
  .pipe-detail code { background: rgba(255,255,255,0.6); }

  /* Transformer block (L0) */
  .tblock {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 16px auto;
    max-width: 480px;
  }
  .tblock-step {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin: 2px 0;
  }
  .tblock-box {
    flex: 1;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 13px;
    text-align: center;
    cursor: help;
    transition: all 0.15s ease;
  }
  .tblock-box:hover { border-color: var(--accent); background: var(--accent-soft); }
  .tblock-box.ln { background: #fdf6e3; border-color: #d4b35f; }
  .tblock-box.attn { background: #eaf4ff; border-color: #5b8fd6; }
  .tblock-box.mlp { background: #f0eaff; border-color: var(--accent); }
  .tblock-box.add { background: var(--good-soft); border-color: var(--good); font-family: "SF Mono", monospace; }
  .tblock-arrow {
    color: var(--ink-fainter);
    font-size: 18px;
    text-align: center;
    line-height: 1;
    margin: -2px 0;
  }
  .tblock-residual {
    position: relative;
    padding-left: 30px;
    width: 100%;
  }
  .tblock-side {
    font-size: 11px;
    color: var(--ink-soft);
    width: 70px;
    text-align: right;
    font-style: italic;
  }
  .tblock-stack {
    background: var(--code);
    padding: 14px;
    border-radius: 6px;
    margin-top: 18px;
  }
  .tblock-stack-row {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .tblock-unit {
    padding: 4px 10px;
    background: var(--accent);
    color: white;
    border-radius: 4px;
    font-size: 11px;
    font-family: "SF Mono", monospace;
  }
  .tblock-unit.emb { background: var(--good); }
  .tblock-unit.head { background: var(--bad); }

  /* Depth dial (L0) */
  .depth-readout {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;

/* =========================================================
   STATE
   ========================================================= */
const STORAGE_KEY = 'diffusion-study-v1';
let state = loadState();

function loadState() {
  const defaults = {
    currentLesson: 0,
    read: {},          // lessonId -> true
    grades: {},        // questionId -> 'got' | 'partial' | 'unsure'
    responses: {},     // questionId -> string (user's typed answer)
    quizMode: false,
  };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...defaults, ...JSON.parse(raw) };
  } catch(e) {}
  return defaults;
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

/* =========================================================
   RENDERING
   ========================================================= */

function render() {
  renderProgress();
  renderTabs();
  renderLesson();
  saveState();
}

function renderProgress() {
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  LESSONS.forEach((lesson, i) => {
    const cell = document.createElement('div');
    cell.className = 'progress-cell';
    if (state.read[lesson.id]) cell.classList.add('read');
    if (lessonFullyGraded(lesson)) cell.classList.add('quizzed');
    if (i === state.currentLesson) cell.classList.add('active');
    cell.title = lesson.short;
    cell.onclick = () => jumpTo(i);
    row.appendChild(cell);
  });
}

function lessonFullyGraded(lesson) {
  if (!lesson.quiz || lesson.quiz.length === 0) return false;
  return lesson.quiz.every(q => state.grades[q.id]);
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  LESSONS.forEach((lesson, i) => {
    const btn = document.createElement('button');
    btn.textContent = lesson.short;
    if (i === state.currentLesson) btn.classList.add('active');
    btn.onclick = () => jumpTo(i);
    tabs.appendChild(btn);
  });
}

function jumpTo(i) {
  state.currentLesson = i;
  state.read[LESSONS[i].id] = true;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderLesson() {
  const lesson = LESSONS[state.currentLesson];
  state.read[lesson.id] = true;
  const c = document.getElementById('content');
  c.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'lesson';

  const h2 = document.createElement('h2');
  h2.textContent = lesson.title;
  wrap.appendChild(h2);

  const spine = document.createElement('div');
  spine.className = 'spine';
  spine.textContent = lesson.spine;
  wrap.appendChild(spine);

  lesson.sections.forEach(sec => {
    const s = document.createElement('section');
    s.className = 'block';
    const h3 = document.createElement('h3');
    h3.textContent = sec.title;
    s.appendChild(h3);
    const body = document.createElement('div');
    body.innerHTML = sec.html;
    s.appendChild(body);
    if (sec.visual) {
      const v = buildVisual(sec.visual);
      if (v) s.appendChild(v);
    }
    wrap.appendChild(s);
  });

  if (lesson.quiz && lesson.quiz.length > 0) {
    wrap.appendChild(buildQuiz(lesson));
  }

  wrap.appendChild(buildLessonNav());
  c.appendChild(wrap);

  // Initialize any deferred visuals
  setTimeout(initDeferredVisuals, 50);
}

function buildLessonNav() {
  const nav = document.createElement('div');
  nav.className = 'lesson-nav';
  const prev = document.createElement('button');
  prev.className = 'btn';
  prev.textContent = '← Prev';
  prev.disabled = state.currentLesson === 0;
  prev.onclick = () => jumpTo(state.currentLesson - 1);
  const next = document.createElement('button');
  next.className = 'btn primary';
  next.textContent = state.currentLesson === LESSONS.length - 1 ? 'Done' : 'Next →';
  next.disabled = state.currentLesson === LESSONS.length - 1;
  next.onclick = () => jumpTo(state.currentLesson + 1);
  nav.appendChild(prev);
  nav.appendChild(next);
  return nav;
}

/* =========================================================
   QUIZ
   ========================================================= */

function buildQuiz(lesson) {
  const wrap = document.createElement('div');
  wrap.className = 'quiz';

  const h = document.createElement('h3');
  h.textContent = `Quiz: ${lesson.short}`;
  wrap.appendChild(h);

  const sub = document.createElement('div');
  sub.className = 'quiz-sub';
  sub.innerHTML = 'Write your answer in your own words below each question (auto-saved), <em>then</em> reveal to compare. "Unsure" is always a valid, informative answer.';
  wrap.appendChild(sub);

  const ctrls = document.createElement('div');
  ctrls.className = 'quiz-controls';
  const revealAll = document.createElement('button');
  revealAll.className = 'btn';
  revealAll.textContent = 'Reveal all';
  revealAll.onclick = () => {
    wrap.querySelectorAll('.quiz-answer').forEach(a => a.classList.add('visible'));
    wrap.querySelectorAll('.self-grade').forEach(a => a.classList.add('visible'));
  };
  const reset = document.createElement('button');
  reset.className = 'btn';
  reset.textContent = 'Reset grades';
  reset.onclick = () => {
    lesson.quiz.forEach(q => { delete state.grades[q.id]; });
    render();
  };
  const exportBtn = document.createElement('button');
  exportBtn.className = 'btn';
  exportBtn.textContent = 'Copy my answers';
  exportBtn.onclick = () => {
    const lines = [`# ${lesson.title}`, ''];
    lesson.quiz.forEach(q => {
      const stripHtml = s => s.replace(/<[^>]+>/g, '').replace(/&[a-z]+;/g, ' ').trim();
      lines.push(`## ${q.id}. ${stripHtml(q.q)}`);
      lines.push('');
      lines.push('**My answer:**');
      lines.push(state.responses[q.id]?.trim() || '_(no response)_');
      lines.push('');
      lines.push('**Model answer:**');
      lines.push(stripHtml(q.a));
      const g = state.grades[q.id];
      if (g) lines.push('', `**Self-grade:** ${g === 'got' ? '✓ Got it' : g === 'partial' ? '~ Partial' : '? Unsure'}`);
      lines.push('', '---', '');
    });
    const text = lines.join('\n');
    navigator.clipboard.writeText(text).then(() => {
      exportBtn.textContent = '✓ Copied';
      setTimeout(() => { exportBtn.textContent = 'Copy my answers'; }, 1500);
    }, () => {
      exportBtn.textContent = '✗ Copy failed';
      setTimeout(() => { exportBtn.textContent = 'Copy my answers'; }, 1500);
    });
  };
  ctrls.appendChild(revealAll);
  ctrls.appendChild(reset);
  ctrls.appendChild(exportBtn);
  wrap.appendChild(ctrls);

  lesson.quiz.forEach(q => {
    const item = document.createElement('div');
    item.className = 'quiz-item';

    const qDiv = document.createElement('div');
    qDiv.className = 'quiz-q';
    qDiv.innerHTML = `<span class="q-label">${q.id}</span>${q.q}`;
    item.appendChild(qDiv);

    // User's typed response
    const respDiv = document.createElement('div');
    respDiv.className = 'quiz-response';
    const respLabel = document.createElement('div');
    respLabel.className = 'response-label';
    const respLabelText = document.createElement('span');
    respLabelText.textContent = 'Your answer';
    const saveHint = document.createElement('span');
    saveHint.className = 'save-hint';
    saveHint.textContent = 'saved';
    respLabel.appendChild(respLabelText);
    respLabel.appendChild(saveHint);
    respDiv.appendChild(respLabel);
    const ta = document.createElement('textarea');
    ta.placeholder = 'Write your answer in your own words, then reveal to compare. "Unsure" is always a valid answer.';
    ta.value = state.responses[q.id] || '';
    function autosize() {
      ta.style.height = 'auto';
      ta.style.height = (ta.scrollHeight + 2) + 'px';
    }
    let saveTimer = null;
    ta.addEventListener('input', () => {
      state.responses[q.id] = ta.value;
      autosize();
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveState();
        saveHint.classList.add('visible');
        setTimeout(() => saveHint.classList.remove('visible'), 800);
      }, 200);
    });
    respDiv.appendChild(ta);
    item.appendChild(respDiv);
    // size after attach so scrollHeight is correct
    setTimeout(autosize, 0);

    const aDiv = document.createElement('div');
    aDiv.className = 'quiz-answer';
    aDiv.innerHTML = q.a;
    item.appendChild(aDiv);

    const grade = document.createElement('div');
    grade.className = 'self-grade';
    grade.innerHTML = `<strong>How did you do?</strong>`;
    const row = document.createElement('div');
    row.className = 'self-grade-row';
    ['got','partial','unsure'].forEach(level => {
      const labels = { got: '✓ Got it', partial: '~ Partial', unsure: '? Unsure' };
      const b = document.createElement('button');
      b.className = 'grade-btn';
      b.textContent = labels[level];
      if (state.grades[q.id] === level) b.classList.add('selected', level);
      b.onclick = () => {
        state.grades[q.id] = level;
        render();
      };
      row.appendChild(b);
    });
    grade.appendChild(row);
    item.appendChild(grade);

    const actions = document.createElement('div');
    actions.className = 'quiz-actions';
    const reveal = document.createElement('button');
    reveal.className = 'btn primary';
    reveal.textContent = 'Reveal answer';
    reveal.onclick = () => {
      aDiv.classList.add('visible');
      grade.classList.add('visible');
      reveal.disabled = true;
    };
    if (state.grades[q.id]) {
      aDiv.classList.add('visible');
      grade.classList.add('visible');
      reveal.disabled = true;
    }
    actions.appendChild(reveal);
    item.appendChild(actions);

    wrap.appendChild(item);
  });

  // Summary
  const grades = lesson.quiz.map(q => state.grades[q.id]).filter(Boolean);
  if (grades.length === lesson.quiz.length) {
    const sum = document.createElement('div');
    sum.className = 'quiz-summary visible';
    const got = grades.filter(g => g === 'got').length;
    const partial = grades.filter(g => g === 'partial').length;
    const unsure = grades.filter(g => g === 'unsure').length;
    sum.innerHTML = `<strong>Quiz complete:</strong> ${got} got · ${partial} partial · ${unsure} unsure`;
    if (unsure > 0 || partial > 0) {
      sum.innerHTML += ` — re-read the lesson and try again.`;
    } else {
      sum.innerHTML += ` — you own this lesson. ✓`;
    }
    wrap.appendChild(sum);
  }

  return wrap;
}

/* ----------- VISUAL: Pipeline (L0) ----------- */
function buildPipeline(wrap, title) {
  title.textContent = 'Interactive — The 5-stage language-model pipeline';

  const desc = document.createElement('div');
  desc.style.fontSize = '13px';
  desc.style.color = 'var(--ink-soft)';
  desc.style.marginBottom = '10px';
  desc.innerHTML = 'Click any stage. Every one is still "predict next token" — what changes is the data curriculum it sees.';
  wrap.appendChild(desc);

  const stages = [
    { num: '1', name: 'Tokenize', teaches: '~50,000 subword pieces',
      detail: '<h5>Tokenize</h5><p>Train a Byte-Pair Encoding tokenizer. Output: a vocabulary of ~50,000 reusable subword pieces.</p><p><code>"hello world"</code> → <code>[15496, 995]</code></p><p>The model never sees text — it sees integer IDs. Tokenizer choices propagate to every later stage.</p>' },
    { num: '2', name: 'Pretrain', teaches: '"how language works"',
      detail: '<h5>Pretrain</h5><p>The big one. Feed the model raw web text, ~trillions of tokens. Loss: cross-entropy on the next token.</p><p>Output: a "base model" that completes text but doesn\'t know what an assistant is. Cost dominates the pipeline.</p>' },
    { num: '3', name: 'Supervised Fine-Tuning', teaches: '"assistant turn format"',
      detail: '<h5>Supervised Fine-Tuning</h5><p>Same loss (predict next token), but now on curated conversations:</p><p><code>&lt;|user|&gt;hi&lt;|assistant|&gt;hello!&lt;|end|&gt;</code></p><p>Teaches the model the chat format and basic helpfulness. Small data, small compute, big behavior change.</p>' },
    { num: '4', name: 'Reinforcement Learning', teaches: '"human taste"',
      detail: '<h5>Reinforcement Learning</h5><p>Optimize against preference pairs (chosen vs. rejected). Two approaches:</p><ul><li><strong>Proximal Policy Optimization (the classic Reinforcement Learning from Human Feedback recipe):</strong> reward model + reinforcement learning loop (3 models, sampling in-loop, unstable)</li><li><strong>Direct Preference Optimization:</strong> one cross-entropy loss directly on the policy — no reward model, no sampling</li></ul><p><em>Lesson 4 dissects Direct Preference Optimization.</em></p>' },
    { num: '5', name: 'Serve', teaches: '(inference loop)',
      detail: '<h5>Serve</h5><p>Autoregressive decoding: predict token, append, feed back in, repeat. Key/Value cache to avoid recomputation.</p><p><strong>This is where the entire Lesson 1 problem lives.</strong> N tokens out = N serial forward passes. Inception replaces this stage by replacing the model class.</p>' },
  ];

  const flow = document.createElement('div');
  flow.className = 'pipeline';
  wrap.appendChild(flow);

  const detail = document.createElement('div');
  detail.className = 'pipe-detail';
  wrap.appendChild(detail);

  let active = null;
  stages.forEach((s, i) => {
    const cell = document.createElement('div');
    cell.className = 'pipe-stage';
    cell.innerHTML = `<div class="pipe-num">stage ${s.num}</div><div class="pipe-name">${s.name}</div><div class="pipe-teaches">${s.teaches}</div>`;
    cell.onclick = () => {
      if (active === i) {
        detail.classList.remove('visible');
        cell.classList.remove('active');
        active = null;
      } else {
        flow.querySelectorAll('.pipe-stage').forEach(c => c.classList.remove('active'));
        cell.classList.add('active');
        detail.innerHTML = s.detail;
        detail.classList.add('visible');
        active = i;
      }
    };
    flow.appendChild(cell);
  });

  // auto-open the first one to invite interaction
  flow.children[0].click();

  return wrap;
}

function buildTransformerBlock(wrap, title) {
  title.textContent = 'Interactive — Inside one transformer block';

  const desc = document.createElement('div');
  desc.style.fontSize = '13px';
  desc.style.color = 'var(--ink-soft)';
  desc.style.marginBottom = '10px';
  desc.innerHTML = 'Hover any box. This recipe is repeated N times in series (depth = N). That\'s the whole architecture.';
  wrap.appendChild(desc);

  const blk = document.createElement('div');
  blk.className = 'tblock';
  blk.innerHTML = `
    <div class="tblock-step">
      <div class="tblock-side">input</div>
      <div class="tblock-box" title="A vector for each token in the sequence — shape: [seq_len × embed_dim]">x (token vectors)</div>
      <div class="tblock-side"></div>
    </div>
    <div class="tblock-arrow">↓</div>
    <div class="tblock-step">
      <div class="tblock-side">normalize</div>
      <div class="tblock-box ln" title="Per-token normalization. Stabilizes scale before each sub-layer. Pre-norm is the modern convention.">LayerNorm</div>
      <div class="tblock-side"></div>
    </div>
    <div class="tblock-arrow">↓</div>
    <div class="tblock-step">
      <div class="tblock-side">mix tokens</div>
      <div class="tblock-box attn" title="Each token computes a Query, a Key, and a Value; attends to every prior token (causal mask). The N×N matrix Lesson 1 talks about.">Multi-Head Self-Attention</div>
      <div class="tblock-side">N×N matrix</div>
    </div>
    <div class="tblock-arrow">↓</div>
    <div class="tblock-step">
      <div class="tblock-side">residual</div>
      <div class="tblock-box add" title="Add the block input back in. This is the express lane that lets gradients flow through deep stacks.">+ x  (residual)</div>
      <div class="tblock-side"></div>
    </div>
    <div class="tblock-arrow">↓</div>
    <div class="tblock-step">
      <div class="tblock-side">normalize</div>
      <div class="tblock-box ln" title="Second LayerNorm before the feed-forward network.">LayerNorm</div>
      <div class="tblock-side"></div>
    </div>
    <div class="tblock-arrow">↓</div>
    <div class="tblock-step">
      <div class="tblock-side">think per token</div>
      <div class="tblock-box mlp" title="Two-layer feed-forward network (a multi-layer perceptron), Gaussian Error Linear Unit activation. Expand to 4× the embedding dimension then contract. Per-token, no mixing.">Feed-Forward Network (4× expand)</div>
      <div class="tblock-side">per-token</div>
    </div>
    <div class="tblock-arrow">↓</div>
    <div class="tblock-step">
      <div class="tblock-side">residual</div>
      <div class="tblock-box add" title="Add the post-attention activations back in.">+ x  (residual)</div>
      <div class="tblock-side"></div>
    </div>
    <div class="tblock-arrow">↓</div>

/* ----------- VISUAL: Depth-as-only-knob dial (L0) ----------- */
function buildDepth(wrap, title) {
  title.textContent = 'Interactive — Depth is the only knob (compute-optimal scaling)';

  const desc = document.createElement('div');
  desc.style.fontSize = '13px';
  desc.style.color = 'var(--ink-soft)';
  desc.style.marginBottom = '10px';
  desc.innerHTML = 'Slide depth. Width, heads, learning rate, schedule, training tokens — all derived from this one number to be compute-optimal.';
  wrap.appendChild(desc);

  const ctrls = document.createElement('div');
  ctrls.className = 'v-controls';
  const lbl = document.createElement('span');
  lbl.style.fontFamily = '"SF Mono", monospace';
  lbl.style.minWidth = '90px';
  const slider = document.createElement('input');
  slider.type = 'range'; slider.min = 4; slider.max = 36; slider.value = 12; slider.step = 1;
  ctrls.appendChild(lbl);
  ctrls.appendChild(slider);
  wrap.appendChild(ctrls);

  const readout = document.createElement('div');
  readout.className = 'depth-readout';
  wrap.appendChild(readout);

  const tier = document.createElement('div');
  tier.className = 'depth-tier';
  wrap.appendChild(tier);

  function update(d) {
    // nanochat-style derivations (approximate)
    const width = 64 * d;
    const heads = d;
    // params ~ 12 * d * width^2 + embedding overhead → roughly cubic in d
    const params = (12 * d * width * width + 50000 * width) / 1e6; // millions
    // Chinchilla-optimal tokens: ~20× params
    const tokens = params * 20; // millions of tokens
    // Cost — rough: nanochat depth=20 ≈ $100; scale ~ params × tokens / (depth=20 reference)
    const refParams = 12 * 20 * 1280 * 1280 / 1e6;
    const refCost = 100;
    const cost = refCost * (params * tokens) / (refParams * refParams * 20);

    lbl.textContent = `depth = ${d}`;
    readout.innerHTML = `
      <div class="depth-cell"><div class="label">width</div><div class="val">${width}</div></div>
      <div class="depth-cell"><div class="label">heads</div><div class="val">${heads}</div></div>
      <div class="depth-cell"><div class="label">parameters</div><div class="val">${params < 1000 ? params.toFixed(0)+'M' : (params/1000).toFixed(2)+'B'}</div></div>
      <div class="depth-cell"><div class="label">estimated cost</div><div class="val">$${cost < 1000 ? cost.toFixed(0) : (cost/1000).toFixed(1)+'K'}</div></div>
    `;

    let label;
    if (d < 8)       label = 'tiny — toy / Shakespeare-scale';
    else if (d < 16) label = 'small — GPT-2 small territory';
    else if (d < 22) label = 'medium — GPT-2 medium territory';
    else if (d < 28) label = '★ GPT-2 capability emerges here';
    else if (d < 34) label = 'large — GPT-2 extra-large territory';
    else             label = 'frontier-base — what real labs train (still the same recipe)';
    tier.textContent = label;
  }
  slider.oninput = e => update(parseInt(e.target.value));
  update(12);

  const note = document.createElement('div');
  note.className = 'callout';
  note.style.fontSize = '13px';
  note.style.marginTop = '14px';
  note.innerHTML = '<strong>What this proves:</strong> the autoregressive training recipe has <em>converged</em>. You pick a budget, you get a model. Inception\'s opportunity is exactly because this stage is now commodity — the differentiator has moved up to model class + serving + control.';
  wrap.appendChild(note);

  return wrap;
}

function buildDoorway(wrap, title) {

  wrap.appendChild(desc);

  const sequence = ['The','model','must','wait','for','each','token','to','finish','before','the','next','one','can','start','.'];
  const row = document.createElement('div');
  row.className = 'token-row';
  wrap.appendChild(row);

  const stats = document.createElement('div');
  stats.style.marginTop = '10px';
  stats.style.fontSize = '13px';
  stats.style.fontFamily = '"SF Mono", monospace';
  stats.style.color = 'var(--ink-soft)';
  wrap.appendChild(stats);

  const ctrls = document.createElement('div');
  ctrls.className = 'v-controls';
  const stepBtn = document.createElement('button');
  stepBtn.className = 'btn primary';
  stepBtn.textContent = 'Generate next token';
  const autoBtn = document.createElement('button');
  autoBtn.className = 'btn';
  autoBtn.textContent = 'Auto-play';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn';
  resetBtn.textContent = 'Reset';
  ctrls.appendChild(stepBtn);
  ctrls.appendChild(autoBtn);
  ctrls.appendChild(resetBtn);
  wrap.appendChild(ctrls);

  let i = 0;
  let timer = null;
  const tokenLatencyMs = 40; // pretend
  function renderRow() {
    row.innerHTML = '';
    sequence.forEach((tok, idx) => {
      const b = document.createElement('div');
      b.className = 'token-box';
      if (idx >= i) b.classList.add('pending');
      b.textContent = idx < i ? tok : '·';
      row.appendChild(b);
    });
    stats.innerHTML = `Generated <strong>${i}</strong> / ${sequence.length} tokens · simulated latency: <strong>${i * tokenLatencyMs}ms</strong> (serial: ${i} × ${tokenLatencyMs}ms)`;
    stepBtn.disabled = i >= sequence.length;
  }
  function step() {
    if (i < sequence.length) {
      i++;
      renderRow();
    } else {
      stopAuto();
    }
  }
  function stopAuto() {
    if (timer) { clearInterval(timer); timer = null; autoBtn.textContent = 'Auto-play'; }
  }
  stepBtn.onclick = step;
  autoBtn.onclick = () => {
    if (timer) { stopAuto(); return; }
    autoBtn.textContent = 'Pause';
    timer = setInterval(() => {
      if (i >= sequence.length) { stopAuto(); return; }
      step();
    }, 200);
  };
  resetBtn.onclick = () => { stopAuto(); i = 0; renderRow(); };
  renderRow();
  return wrap;
}

/* ----------- VISUAL: Noise strip (diffusion forward process) ----------- */
function buildNoiseStrip(wrap, title) {
  title.textContent = 'Interactive — The forward process (data → noise, no training)';
  const desc = document.createElement('div');
  desc.style.fontSize = '13px';
  desc.style.color = 'var(--ink-soft)';
  desc.style.marginBottom = '10px';
  desc.innerHTML = 'Move the slider to add noise to a "photo". This direction is <strong>free</strong> — no model. The task of diffusion is learning to <em>reverse</em> this.';
  wrap.appendChild(desc);

  const canvas = document.createElement('canvas');
  canvas.width = 240; canvas.height = 60;
  canvas.style.display = 'block';
  canvas.style.margin = '0 auto';
  canvas.style.borderRadius = '4px';
  canvas.style.border = '1px solid var(--line)';
  canvas.style.imageRendering = 'pixelated';
  canvas.style.width = '240px';
  canvas.style.height = '60px';
  wrap.appendChild(canvas);

  const lbl = document.createElement('div');
  lbl.className = 'v-readout';
  lbl.style.textAlign = 'center';
  lbl.style.marginTop = '8px';
  wrap.appendChild(lbl);

  const ctrls = document.createElement('div');
  ctrls.className = 'v-controls';
  const tLbl = document.createElement('span');
  tLbl.style.fontFamily = '"SF Mono", monospace';
  tLbl.textContent = 't = 0';
  const slider = document.createElement('input');
  slider.type = 'range'; slider.min = 0; slider.max = 100; slider.value = 0;
  const reverseBtn = document.createElement('button');
  reverseBtn.className = 'btn';
  reverseBtn.textContent = '↻ Animate reverse (denoising)';
  ctrls.appendChild(tLbl);
  ctrls.appendChild(slider);
  ctrls.appendChild(reverseBtn);
  wrap.appendChild(ctrls);

  // generate a stable "clean image" — a simple gradient with a circle
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const clean = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      // sky-ish gradient + a "sun"
      const sky = 200 - y * 1.5;
      const r = Math.sqrt((x - 60)*(x-60) + (y - 20)*(y - 20));
      const sun = r < 14 ? 230 : 0;
      clean.data[i]   = Math.min(255, Math.max(0, sky * 0.5 + sun));
      clean.data[i+1] = Math.min(255, Math.max(0, sky * 0.8 + sun * 0.7));
      clean.data[i+2] = Math.min(255, Math.max(0, sky + sun * 0.3));
      clean.data[i+3] = 255;
    }
  }

  function draw(t) {
    const img = ctx.createImageData(W, H);
    for (let i = 0; i < clean.data.length; i += 4) {
      // VP-like blend: x_t = sqrt(1-t)*x_0 + sqrt(t)*noise
      const alpha = Math.sqrt(1 - t);
      const beta = Math.sqrt(t);
      const n = (Math.random() - 0.5) * 255 * 2;
      img.data[i]   = Math.min(255, Math.max(0, clean.data[i]   * alpha + 128 + n * beta));
      img.data[i+1] = Math.min(255, Math.max(0, clean.data[i+1] * alpha + 128 + n * beta));
      img.data[i+2] = Math.min(255, Math.max(0, clean.data[i+2] * alpha + 128 + n * beta));
      img.data[i+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    tLbl.textContent = `t = ${t.toFixed(2)}`;
    const stage = t < 0.05 ? 'pure data (free)' : t > 0.95 ? 'pure noise (free)' : `noise level ${(t*100).toFixed(0)}%`;
    lbl.innerHTML = `Forward step at noise level <strong>${(t*100).toFixed(0)}%</strong> · ${stage}`;
  }

  slider.oninput = e => draw(parseInt(e.target.value) / 100);

  let revTimer = null;
  reverseBtn.onclick = () => {
    if (revTimer) { clearInterval(revTimer); revTimer = null; reverseBtn.textContent = '↻ Animate reverse (denoising)'; return; }
    reverseBtn.textContent = '⏸ Pause';
    slider.value = 100;
    draw(1);
    let cur = 100;
    revTimer = setInterval(() => {
      cur -= 5;
      if (cur <= 0) { cur = 0; clearInterval(revTimer); revTimer = null; reverseBtn.textContent = '↻ Animate reverse (denoising)'; }
      slider.value = cur;
      draw(cur / 100);
    }, 100);
  };

  draw(0);
  return wrap;
}

/* ----------- VISUAL: Compass / score ----------- */
function buildCompass(wrap, title) {
  title.textContent = 'Interactive — The score is the compass';
  const desc = document.createElement('div');
  desc.style.fontSize = '13px';
  desc.style.color = 'var(--ink-soft)';
  desc.style.marginBottom = '10px';
  desc.innerHTML = 'The white dot is your noisy sample. The arrow is the <strong>score</strong> — the direction of "more data-like" at this noise level. Click anywhere to teleport, and watch the compass repoint.';
  wrap.appendChild(desc);

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 300 200');
  svg.style.width = '100%';
  svg.style.maxWidth = '480px';
  svg.style.display = 'block';
  svg.style.margin = '0 auto';
  svg.style.background = 'linear-gradient(180deg, #ede9d8, #d6cdb0)';
  svg.style.borderRadius = '6px';
  svg.style.cursor = 'crosshair';
  wrap.appendChild(svg);

  // Two "data modes" — the target distribution
  const modes = [{ x: 80, y: 70, r: 26 }, { x: 220, y: 130, r: 26 }];
  modes.forEach(m => {
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', m.x); c.setAttribute('cy', m.y); c.setAttribute('r', m.r);
    c.setAttribute('fill', '#5b3fa8'); c.setAttribute('opacity', '0.18');
    svg.appendChild(c);
    const c2 = document.createElementNS(svgNS, 'circle');
    c2.setAttribute('cx', m.x); c2.setAttribute('cy', m.y); c2.setAttribute('r', '5');
    c2.setAttribute('fill', '#5b3fa8');
    svg.appendChild(c2);
    const lbl = document.createElementNS(svgNS, 'text');
    lbl.setAttribute('x', m.x); lbl.setAttribute('y', m.y + m.r + 14);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size', '10');
    lbl.setAttribute('fill', '#5b3fa8');
    lbl.textContent = 'data mode';
    svg.appendChild(lbl);
  });

  // sample dot + arrow
  let pos = { x: 150, y: 100 };
  const sample = document.createElementNS(svgNS, 'circle');
  sample.setAttribute('r', '7');
  sample.setAttribute('fill', '#fff');
  sample.setAttribute('stroke', '#1a1a1a');
  sample.setAttribute('stroke-width', '1.5');
  svg.appendChild(sample);

  const arrow = document.createElementNS(svgNS, 'line');
  arrow.setAttribute('stroke', '#c0392b'); arrow.setAttribute('stroke-width', '2.5');
  arrow.setAttribute('marker-end', 'url(#arrowHead)');
  svg.appendChild(arrow);

  // arrowhead
  const defs = document.createElementNS(svgNS, 'defs');
  defs.innerHTML = '<marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>';
  svg.appendChild(defs);

  function score(x, y) {
    // sum of gaussian-attracted gradients toward each mode
    let sx = 0, sy = 0;
    modes.forEach(m => {
      const dx = m.x - x, dy = m.y - y;
      const d2 = dx*dx + dy*dy + 1;
      const w = Math.exp(-d2 / 5000);
      sx += dx * w; sy += dy * w;
    });
    return { sx, sy };
  }
  function render() {
    sample.setAttribute('cx', pos.x);
    sample.setAttribute('cy', pos.y);
    const { sx, sy } = score(pos.x, pos.y);
    const norm = Math.sqrt(sx*sx + sy*sy) || 1;
    const len = 28;
    arrow.setAttribute('x1', pos.x);
    arrow.setAttribute('y1', pos.y);
    arrow.setAttribute('x2', pos.x + sx / norm * len);
    arrow.setAttribute('y2', pos.y + sy / norm * len);
  }
  svg.addEventListener('click', e => {
    const pt = svg.getBoundingClientRect();
    const x = (e.clientX - pt.left) / pt.width * 300;
    const y = (e.clientY - pt.top) / pt.height * 200;
    pos = { x, y };
    render();
  });

  const ctrls = document.createElement('div');
  ctrls.className = 'v-controls';
  const stepBtn = document.createElement('button');
  stepBtn.className = 'btn primary';
  stepBtn.textContent = 'Step in score direction';
  const walkBtn = document.createElement('button');
  walkBtn.className = 'btn';
  walkBtn.textContent = '▶ Walk toward data';
  ctrls.appendChild(stepBtn);
  ctrls.appendChild(walkBtn);
  wrap.appendChild(ctrls);

  stepBtn.onclick = () => {
    const { sx, sy } = score(pos.x, pos.y);
    const norm = Math.sqrt(sx*sx + sy*sy) || 1;
    pos.x += sx / norm * 12;
    pos.y += sy / norm * 12;
    render();
  };
  let walkTimer = null;
  walkBtn.onclick = () => {
    if (walkTimer) { clearInterval(walkTimer); walkTimer = null; walkBtn.textContent = '▶ Walk toward data'; return; }
    walkBtn.textContent = '⏸ Pause';
    walkTimer = setInterval(() => {
      const { sx, sy } = score(pos.x, pos.y);
      const norm = Math.sqrt(sx*sx + sy*sy) || 1;
      if (norm < 0.5) { clearInterval(walkTimer); walkTimer = null; walkBtn.textContent = '▶ Walk toward data'; return; }
      pos.x += sx / norm * 6;
      pos.y += sy / norm * 6;
      render();
    }, 80);
  };
  render();
  return wrap;
}

    svg.appendChild(end);
    const eLbl = document.createElementNS(svgNS, 'text');
    eLbl.setAttribute('x', 185); eLbl.setAttribute('y', 70); eLbl.setAttribute('text-anchor', 'middle');
    eLbl.setAttribute('font-size', '8'); eLbl.setAttribute('fill', '#5b3fa8');
    eLbl.textContent = 'data'; svg.appendChild(eLbl);
  }
  setupSvg(left.svg);
  setupSvg(right.svg);

  const ctrls = document.createElement('div');
  ctrls.className = 'v-controls';
  const runBtn = document.createElement('button');
  runBtn.className = 'btn primary';
  runBtn.textContent = '▶ Run both walks';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn';
  resetBtn.textContent = 'Reset';
  ctrls.appendChild(runBtn);
  ctrls.appendChild(resetBtn);
  wrap.appendChild(ctrls);

  let leftSteps = 0, rightSteps = 0;
  let leftPos = { x: 15, y: 50 }, rightPos = { x: 15, y: 50 };
  let leftLine = null, rightLine = null;

  function reset() {
    setupSvg(left.svg); setupSvg(right.svg);
    leftSteps = 0; rightSteps = 0;
    leftPos = { x: 15, y: 50 }; rightPos = { x: 15, y: 50 };
    leftLine = document.createElementNS(svgNS, 'polyline');
    leftLine.setAttribute('fill', 'none'); leftLine.setAttribute('stroke', '#c0392b'); leftLine.setAttribute('stroke-width', '1.5');
    leftLine.setAttribute('points', '15,50');
    left.svg.appendChild(leftLine);
    rightLine = document.createElementNS(svgNS, 'polyline');
    rightLine.setAttribute('fill', 'none'); rightLine.setAttribute('stroke', '#2f8a4e'); rightLine.setAttribute('stroke-width', '2');
    rightLine.setAttribute('points', '15,50');
    right.svg.appendChild(rightLine);
    left.counter.textContent = '0 steps';
    right.counter.textContent = '0 steps';
  }
  reset();

  let timer = null;
  function step() {
    let advanced = false;
    if (leftSteps < 100) {
      // stagger: small step forward + lateral noise
      leftPos.x += 1.7;
      leftPos.y += (Math.random() - 0.5) * 16;
      leftPos.y = Math.max(15, Math.min(85, leftPos.y));
      if (leftPos.x > 185) leftPos.x = 185;
      const pts = leftLine.getAttribute('points');
      leftLine.setAttribute('points', pts + ` ${leftPos.x.toFixed(1)},${leftPos.y.toFixed(1)}`);
      leftSteps++;
      left.counter.innerHTML = `<span style="color: var(--bad)">${leftSteps}</span> steps · wandering`;
      advanced = true;
    }
    if (rightSteps < 10 && rightSteps * 5 <= leftSteps) {
      rightPos.x += 17;
      const pts = rightLine.getAttribute('points');
      rightLine.setAttribute('points', pts + ` ${rightPos.x.toFixed(1)},50`);
      rightSteps++;
      right.counter.innerHTML = `<span style="color: var(--good)">${rightSteps}</span> step${rightSteps === 1 ? '' : 's'} · direct`;
      advanced = true;
    }
    if (!advanced || (leftSteps >= 100 && rightSteps >= 10)) {
      clearInterval(timer); timer = null; runBtn.textContent = '▶ Run both walks';
    }
  }
  runBtn.onclick = () => {
    if (timer) { clearInterval(timer); timer = null; runBtn.textContent = '▶ Run both walks'; return; }
    if (leftSteps >= 100 && rightSteps >= 10) reset();
    runBtn.textContent = '⏸ Pause';
    timer = setInterval(step, 60);
  };
  resetBtn.onclick = () => { if (timer) { clearInterval(timer); timer = null; runBtn.textContent = '▶ Run both walks'; } reset(); };
  return wrap;
}

/* ----------- VISUAL: Quality/latency dial ----------- */
function buildDial(wrap, title) {
  title.textContent = 'Interactive — Step-count dial (one model, many price points)';

  const desc = document.createElement('div');
  desc.style.fontSize = '13px';
  desc.style.color = 'var(--ink-soft)';
  desc.style.marginBottom = '10px';
  desc.innerHTML = 'Mercury 2 ships "tunable reasoning" — the customer chooses a point on this curve. Voice → left edge, code-review → right edge. <strong>Same model.</strong>';
  wrap.appendChild(desc);

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 400 180');
  svg.style.width = '100%';
  svg.style.maxWidth = '480px';
  svg.style.display = 'block';
  svg.style.margin = '0 auto';
  wrap.appendChild(svg);

  // axes
  function addLine(x1,y1,x2,y2,stroke='#888', sw=1) {
    const l = document.createElementNS(svgNS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',sw);
    svg.appendChild(l); return l;
  }
  function addText(x,y,text,opts={}) {
    const t = document.createElementNS(svgNS,'text');
    t.setAttribute('x',x); t.setAttribute('y',y);
    t.setAttribute('font-size', opts.size || 10);
    t.setAttribute('fill', opts.fill || '#555');
    t.setAttribute('text-anchor', opts.anchor || 'start');
    t.textContent = text;
    svg.appendChild(t); return t;
  }
  addLine(50, 20, 50, 150);
  addLine(50, 150, 380, 150);
  addText(45, 15, 'Quality', {anchor:'end', size: 11});
  addText(385, 165, 'Latency →', {size: 11});
  addText(50, 165, 'few steps', {anchor:'middle', size: 9});
  addText(380, 165, 'many steps', {anchor:'middle', size: 9});

  // curve — diminishing returns
  const curve = document.createElementNS(svgNS,'path');
  let d = 'M 50 145';
  for (let x = 50; x <= 380; x += 5) {
    const t = (x - 50) / 330;
    const y = 145 - 110 * (1 - Math.exp(-3 * t));
    d += ` L ${x} ${y.toFixed(1)}`;
  }
  curve.setAttribute('d', d);
  curve.setAttribute('stroke', '#5b3fa8');
  curve.setAttribute('stroke-width', '2.5');
  curve.setAttribute('fill', 'none');
  svg.appendChild(curve);

  // segment markers
  const segments = [
    { x: 85, label: 'voice', desc: '~4 steps' },
    { x: 175, label: 'chat / retrieval', desc: '~10 steps' },
    { x: 295, label: 'code review', desc: '~25 steps' },
    { x: 360, label: 'deep reasoning', desc: '~50+ steps' },
  ];
  segments.forEach(s => {
    const t = (s.x - 50) / 330;
    const y = 145 - 110 * (1 - Math.exp(-3 * t));
    const c = document.createElementNS(svgNS,'circle');
    c.setAttribute('cx', s.x); c.setAttribute('cy', y); c.setAttribute('r', 5);
    c.setAttribute('fill', '#5b3fa8');
    svg.appendChild(c);
    addText(s.x, y - 10, s.label, {anchor:'middle', size: 10, fill:'#1a1a1a'});
    addText(s.x, y + 18, s.desc, {anchor:'middle', size: 9, fill:'#888'});
  });

  addText(195, 35, 'One model. Many tiers.', {anchor:'middle', size: 13, fill:'#5b3fa8'});

  const callout = document.createElement('div');
  callout.className = 'callout';
  callout.style.fontSize = '13px';
  callout.style.marginTop = '14px';
  callout.innerHTML = '<strong>You cannot do this with autoregression.</strong> Autoregression\'s serial chain length is fixed by N tokens output. There\'s no knob.';
  wrap.appendChild(callout);

  return wrap;
}

/* ----------- VISUAL: DPO before/after ----------- */
function buildDPO(wrap, title) {
  title.textContent = 'Direct Preference Optimization — From 3-model reinforcement-learning pipeline to 1 supervised loss';

  const cmp = document.createElement('div');
  cmp.className = 'dpo-compare';

  const before = document.createElement('div');
  before.className = 'dpo-side before';
  before.innerHTML = `<h4 style="color:var(--bad)">Reinforcement Learning from Human Feedback (Proximal Policy Optimization) — the old way</h4>
    <ul>
      <li><strong>Supervised fine-tuning model</strong> — base policy</li>
      <li><strong>Reward model</strong> — trained on human prefs</li>
      <li><strong>Proximal-Policy-Optimization loop</strong> — sample, score, update with Kullback-Leibler-divergence constraint</li>
      <li style="color:var(--bad)">3 models · unstable · sampling in loop</li>
    </ul>`;

  const arrow = document.createElement('div');
  arrow.className = 'dpo-arrow';
  arrow.innerHTML = '→';

  const after = document.createElement('div');
  after.className = 'dpo-side after';
  after.innerHTML = `<h4 style="color:var(--good)">Direct Preference Optimization — the move</h4>
    <ul>
      <li><strong>Just π (policy)</strong> + frozen π_ref</li>
      <li><strong>One binary cross-entropy loss</strong></li>
      <li>Z(x) <em>cancels</em> via Bradley-Terry differences</li>
      <li style="color:var(--good)">1 model · stable · no sampling</li>
    </ul>`;

  cmp.appendChild(before);
  cmp.appendChild(arrow);
  cmp.appendChild(after);
  wrap.appendChild(cmp);

  const formula = document.createElement('div');
  formula.className = 'formula';
  formula.style.fontSize = '13px';
  formula.innerHTML = 'reward = β·log(π/π_ref) + β·log Z(x) &nbsp;→&nbsp; Z(x) cancels in <em>differences</em> &nbsp;→&nbsp; loss = -log σ(β·log(π_w/π_ref_w) − β·log(π_l/π_ref_l))';
  wrap.appendChild(formula);

  const note = document.createElement('div');
  note.className = 'callout warn';
  note.style.fontSize = '13px';
  note.innerHTML = '<strong>Don\'t miss:</strong> the gradient has a built-in weight upweighting pairs the model currently <em>ranks wrong</em>. Delete it → model degenerates. Beats Proximal Policy Optimization even when it has ground-truth rewards (0.36 vs 0.26 win-rate, CNN/DailyMail).';
  wrap.appendChild(note);

  return wrap;
}

/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' && state.currentLesson < LESSONS.length - 1) jumpTo(state.currentLesson + 1);
  if (e.key === 'ArrowLeft' && state.currentLesson > 0) jumpTo(state.currentLesson - 1);
  if (e.key >= '1' && e.key <= '9') {
    const i = parseInt(e.key) - 1;
    if (i < LESSONS.length) jumpTo(i);
  }
});
